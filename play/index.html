<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Clachan</title>
  <link rel="manifest" href="./manifest.json" />
  <style>
    html, body, canvas {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #161816;
    }
    .hearth-link {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 1;
      padding: 8px 11px;
      border: 1px solid rgba(198, 185, 143, 0.6);
      border-radius: 4px;
      background: rgba(22, 24, 22, 0.88);
      color: #e7dfc4;
      font: 14px/1.2 system-ui, sans-serif;
      text-decoration: none;
    }
    .hearth-link:hover, .hearth-link:focus-visible {
      background: #30392d;
      color: #fff4d2;
    }
  </style>
</head>
<body>
  <canvas id="glcanvas" tabindex="1"></canvas>
  <a class="hearth-link" href="../">← Return to the Hearth</a>
  <script src="https://not-fl3.github.io/miniquad-samples/mq_js_bundle.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    }
    load("./clachan.wasm");
  </script>
</body>
</html>
