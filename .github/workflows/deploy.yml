name: Build & Deploy Clachan

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-wasm-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Compile WASM
        run: cargo build --target wasm32-unknown-unknown --release
      - name: Stage Pages bundle
        run: |
          mkdir -p dist
          cp index.html manifest.json sw.js dist/
          cp target/wasm32-unknown-unknown/release/clachan.wasm dist/clachan.wasm
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-pages:
    needs: build-wasm-pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile Native Windows Binary
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: clachan-windows-x64
          path: target/release/clachan.exe
