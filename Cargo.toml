[package]
name = "clachan"
version = "0.1.0"
edition = "2021"
default-run = "clachan"

[dependencies]
chrono = "0.4"
macroquad = "0.4.13"
image = { version = "0.25", features = ["png", "jpeg", "webp"] }
ron = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
macroquad = { version = "0.4.13", features = ["audio"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
